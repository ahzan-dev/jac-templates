[project]
name = "support-agent"
entry-point = "main.jac"
kind = "web-app"

# Which model powers every `by llm()` in this project.
# byLLM is built into jaclang core -- there is no package to install.
#
# Hosted (default): reads OPENAI_API_KEY from the environment.
#   export OPENAI_API_KEY=sk-...
# Swap providers by changing default_model alone -- the Jac code never changes:
#   "claude-sonnet-4-6"        + ANTHROPIC_API_KEY
#   "gemini/gemini-2.0-flash"  + GOOGLE_API_KEY
#
# Zero-key option: `jac install 'byllm[local]'` then
#   default_model = "local:gemma-4-e2b"
# and drop the api_key line entirely. A small local model picks tools less
# reliably than gpt-4o-mini -- expect it to skip the second call in a chain.
[byllm.model]
default_model = "${LLM_MODEL:-gpt-4o-mini}"
api_key = "${OPENAI_API_KEY:-}"


[jac-shadcn]
style = "nova"
baseColor = "neutral"
theme = "amber"
font = "inter"
radius = "default"
menuAccent = "subtle"
menuColor = "default"
[dependencies]
[dependencies.npm]
radix-ui = "*"
class-variance-authority = "*"
"@fontsource-variable/inter" = "*"
shadcn = "^3.8.5"
"@tailwindcss/vite" = "^4.1.17"
tailwindcss = "^4.1.17"
clsx = "^2.1.1"
tailwind-merge = "^3.5.0"
tw-animate-css = "^1.4.0"

[client.vite]
plugins = ["tailwindcss()"]
lib_imports = ["import tailwindcss from '@tailwindcss/vite'"]

# Starter templates run as ONE process. Without this, the runtime
# auto-detects services/ as microservices and pins the gateway to
# port 8000, ignoring `jac start -p <port>`.
[scale.microservices]
enabled = false

[jacpack]
name = "support-agent"
description = "An AI agent that answers from your docs and your customers' data"

[client.app_meta_data]
title = "Support Agent — a multi-tool ReAct agent"
description = "Six tools, no loop to write. Watch the model choose which ones a question actually needs."
keywords = "ai, llm, agent, react, tools, support, jac"
author = "Support Agent"
theme_color = "#dc7702"
og_type = "website"
og_title = "Support Agent"
og_description = "An AI agent that picks its own tools. Watch it choose."
og_site_name = "Support Agent"

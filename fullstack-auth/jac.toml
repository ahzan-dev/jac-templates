[project]
name = "fullstack-auth"
entry-point = "main.jac"
kind = "web-app"

[jac-shadcn]
style = "nova"
baseColor = "neutral"
theme = "amber"
font = "inter"
radius = "default"
menuAccent = "subtle"
menuColor = "default"
[dependencies.npm]
"@hugeicons/core-free-icons" = "latest"
"@hugeicons/react" = "latest"
"@radix-ui/react-slot" = "*"
radix-ui = "*"
class-variance-authority = "*"
"@fontsource-variable/inter" = "*"
shadcn = "^3.8.5"
"@tailwindcss/vite" = "^4.1.17"
tailwindcss = "^4.1.17"
clsx = "^2.1.1"
tailwind-merge = "^3.5.0"
tw-animate-css = "^1.4.0"

[client.vite]
plugins = ["tailwindcss()"]
lib_imports = ["import tailwindcss from '@tailwindcss/vite'"]

# Starter templates run as ONE process. Without this, the runtime
# auto-detects services/ as microservices and pins the gateway to
# port 8000, ignoring `jac start -p <port>`.
[scale.microservices]
enabled = false

[jacpack]
name = "fullstack-auth"
description = "Login, protected routes, per-user data. No database to set up"

# Sign JWTs with an app-specific secret.
#
# Without this, jaclang falls back to ONE hardcoded default shared by every
# Jac app. Since the browser stores the token under an un-namespaced
# "jac_token" key, a token minted by a DIFFERENT app on the same origin then
# validates here and fails as 500 "User not found" -- and the client only
# clears the token on 401, so the app is stuck "logged in" and broken.
# An app-specific secret turns that into a clean 401 -> auto-logout.
#
# CHANGE THIS BEFORE DEPLOYING: set JAC_JWT_SECRET to a real random value.
# The default below is for local development only.
[scale.jwt]
secret = "${JAC_JWT_SECRET:-notebook-dev-secret-change-before-deploy}"

[client.app_meta_data]
title = "Notebook"
description = "Sign up, write notes, sign out. Every note lives on your own graph, persisted with zero setup, and nobody else can read it."
keywords = "notes, auth, fullstack, graph, jac"
author = "Notebook"
theme_color = "#dc7702"
og_type = "website"
og_title = "Notebook"
og_description = "A full-stack notes app with auth and zero-setup persistence -- no database to configure."
og_site_name = "Notebook"

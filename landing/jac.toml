[project]
name = "landing"
entry-point = "main.jac"
kind = "web-app"

[jac-shadcn]
style = "nova"
baseColor = "neutral"
theme = "amber"
font = "inter"
radius = "default"
menuAccent = "subtle"
menuColor = "default"
[dependencies.npm]
"@hugeicons/core-free-icons" = "latest"
"@hugeicons/react" = "latest"
radix-ui = "*"
class-variance-authority = "*"
"@fontsource-variable/inter" = "*"
shadcn = "^3.8.5"
"@tailwindcss/vite" = "^4.1.17"
tailwindcss = "^4.1.17"
clsx = "^2.1.1"
tailwind-merge = "^3.5.0"
tw-animate-css = "^1.4.0"

[serve]
base_route_app = "app"

[client]

[client.vite]
plugins = ["tailwindcss()"]
lib_imports = ["import tailwindcss from '@tailwindcss/vite'"]

[jacpack]
name = "landing"
description = "A polished marketing page. No backend"

# Starter templates run as ONE process. If you add a server module
# (services/*.sv.jac), this keeps the runtime from auto-detecting it as a
# microservice and pinning the gateway to port 8000 (which ignores -p).
[scale.microservices]
enabled = false

[client.app_meta_data]
title = "Slipstream — Ship software at full speed"
description = "Slipstream turns every pull request into a live preview, runs your test suite in parallel, and deploys to the edge the moment you merge."
keywords = "ci, cd, preview deployments, developer tools, saas"
author = "Slipstream"
theme_color = "#dc7702"
og_type = "website"
og_title = "Slipstream — Ship software at full speed"
og_description = "Every pull request becomes a live preview. Deploy the moment you merge."
og_site_name = "Slipstream"

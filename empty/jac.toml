[project]
name = "empty"
version = "0.0.1"
description = "Empty Jac project - start from scratch"
entry-point = "main.jac"
kind = "web-app"

[jac-shadcn]
style = "nova"
baseColor = "neutral"
theme = "amber"
font = "inter"
radius = "default"
menuAccent = "subtle"
menuColor = "default"

# This template is the blank canvas a user lands on when they start from a
# prompt, so the batteries are pre-installed: the agent writes routing, a form
# or an icon on its first turn and the build just works. Removing anything here
# trades a working first prompt for a failed one.
[dependencies]

[dependencies.npm]
react = "^18.2.0"
react-dom = "^18.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
react-hook-form = "^7.71.0"
"@hookform/resolvers" = "^5.2.2"
"@tanstack/react-form" = "^1.33.0"
zod = "^4.3.6"
"@hugeicons/react" = "*"
"@hugeicons/core-free-icons" = "*"
"@radix-ui/react-slot" = "*"
radix-ui = "*"
class-variance-authority = "*"
"@fontsource-variable/inter" = "*"
shadcn = "^3.8.5"
clsx = "^2.1.1"
tailwind-merge = "^3.5.0"
tw-animate-css = "^1.4.0"

# Every shadcn component's npm dep, pre-installed. Adding a component later is
# just a file copy (`jac add --shadcn <name>`, ~1s); INSTALLING its package at
# that point is the part that fails in a running sandbox. So we pay it once,
# up front, and all 54 components work offline from then on.
"@base-ui/react" = "*"
cmdk = "*"
embla-carousel-react = "*"
input-otp = "*"
react-day-picker = "*"
react-resizable-panels = "*"
recharts = "*"
sonner = "*"
vaul = "*"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "^4.2.1"
typescript = "^5.3.3"
"@types/react" = "^18.2.0"
"@types/react-dom" = "^18.2.0"
tailwindcss = "latest"
"@tailwindcss/vite" = "latest"

[dev-dependencies]
watchdog = ">=3.0.0"

# Serves the client at `/`. Without this the app lives at `/cl/app` and `/`
# stays the JSON API index.
[serve]
base_route_app = "app"

[client.vite]
plugins = ["tailwindcss()"]
lib_imports = ["import tailwindcss from '@tailwindcss/vite'"]

# Starter templates run as ONE process. If you add a server module
# (services/*.sv.jac), this keeps the runtime from auto-detecting it as a
# microservice and pinning the gateway to port 8000 (which ignores -p).
[scale.microservices]
enabled = false

[jacpack]
name = "empty"
description = "Start from scratch"

[client.app_meta_data]
title = "A blank canvas"
description = "A minimal jac-shadcn starter with the theme wired up and nothing in the way."
keywords = "jac, starter, shadcn, template"
author = "Blank canvas"
theme_color = "#dc7702"
og_type = "website"
og_title = "A blank canvas"
og_description = "A minimal jac-shadcn starter."
og_site_name = "Blank canvas"
